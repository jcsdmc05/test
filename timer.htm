<input type="button" value="REA INF" onclick="writeText('**Verifiquei no sistema que o fornecimento foi encerrado pelo antigo titular.**\nNeste caso, prosseguiremos com um processo chamado **Reativação**.\nSeguem algumas informações sobre a solicitação:\n1. **Envio de documentos:**\nDe início, é necessário enviar alguns documentos no chat deste atendimento.\n2. **Validação e aprovação:**\nApós a validação e confirmação dos documentos, verificarei com meu supervisor se está tudo correto para a aprovação.\n3. **Prazos:**\nO prazo é de até **3 dias úteis** para vistoria e mais **48 horas** para o serviço de reativação, totalizando **5 dias**.\n4. **Taxa de solicitação:**\nA solicitação é cobrada uma taxa de **R$ 40,00**.\n5. **Forma de pagamento:**\nEsse valor pode ser cobrado em **fatura avulsa** (separada da fatura de consumo), ou posso incluir a cobrança junto à fatura de consumo de água e/ou esgoto, com a possibilidade de **parcelamento**, se necessário.\n6. **Acompanhante maior de 18 anos:**\nTambém informo que é necessária a presença de um **maior de 18 anos** para acompanhar a execução do processo.\n7. **Variabilidade da equipe:**\nO comparecimento da equipe varia conforme a demanda da unidade de sua região.\n- **Está de acordo com as condições, prazo e valor?\n\n- **Deseja que a cobrança do serviço seja separada ou junto com a fatura de consumo, senhor'+n.value+'?**');b.dataset.init=110;b.click();pomodoro_timer.scrollIntoView()" style="color: RGB(243, 184, 22); font-weight: bolder; cursor: pointer;">


<input type="button" value="NOVA INF" onclick="writeText('- **Requisitos para solicitar uma nova ligação de água e esgoto, é necessário que já estejam cumpridos:**\n> **Caixa UMA (Unidade de Medição de Água)** instalada para receber a ligação de água.\n> **Caixa de inspeção** instalada para receber a ligação de esgoto.\n> O terreno deve estar **separado dos adjacentes** por muro, cerca ou divisória.\n> O **número do imóvel** deve estar visível.\n- **Estes requisitos estão cumpridos, senhor'+n.value+'?**\n\n\n**Seguem abaixo algumas informações importantes sobre a sua solicitação:**\n* Após a **validação e confirmação dos documentos**, que realizarei pessoalmente, verificarei com meu **supervisor** se está tudo correto para prosseguirmos com a **aprovação**.\n* O prazo estimado é de:\n\n* **Até 3 dias úteis** para a **vistoria**;\n* **Mais 7 dias** para a **nova ligação**, após a vistoria.\n* Será cobrada uma **taxa referente ao serviço de nova ligação**, que virá em uma **conta futura**.\n\n > Ressaltamos que apenas o **técnico vistoriador da sua região** possui acesso ao valor exato da taxa.\n* É **obrigatória a presença de um maior de 18 anos** para acompanhar a execução do processo.\n* O **comparecimento da equipe técnica** pode variar de acordo com a **demanda da unidade da sua região**.\n\n- **Está de acordo com as condições e os prazos informados?**\n\n- **Deseja que a cobrança do serviço seja separada ou junto com a fatura de consumo, senhor'+n.value+'?**');b.dataset.init=110;b.click();pomodoro_timer.scrollIntoView()" style="color: RGB(209, 125, 247); font-weight: bolder; cursor: pointer;">
