<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Gestão de Serviços</title>

<style>
body {
  font-family: Arial;
  background: #f0f2f5;
  color: #000;
  padding: 20px;
  transition: 0.3s;
}

.dark {
  background: #1e1e1e;
  color: #fff;
}

.container {
  max-width: 800px;
  margin: auto;
}

.grupo {
  background: #fff;
  padding: 15px;
  margin-top: 15px;
  border-radius: 10px;
}

.dark .grupo {
  background: #2c2c2c;
}

.servico {
  display: flex;
  align-items: center;
  margin-top: 8px;
}

.servico label {
  margin-left: 8px;
  flex: 1;
}

.concluido {
  text-decoration: line-through;
  opacity: 0.6;
}

button {
  margin-left: 5px;
  padding: 5px 8px;
  border: none;
  border-radius: 5px;
  cursor: pointer;
}

.remover { background: red; color: #fff; }
.reset { background: blue; color: #fff; }
.toggle { background: gray; color: #fff; }
.editar { background: orange; color: #fff; }

input {
  padding: 5px;
}
</style>
</head>

<body>

<div class="container">
  <h1>Gestão de Serviços</h1>

  <button onclick="toggleDarkMode()">🌙 Modo Noturno</button>

  <br><br>

  <input type="text" id="novoGrupo" placeholder="Nome do serviço">
  <button onclick="criarGrupo()">Adicionar Serviço</button>

  <div id="grupos"></div>
</div>

<script>
let dados = JSON.parse(localStorage.getItem("servicos")) || [];
let darkMode = localStorage.getItem("darkMode") === "true";

if (darkMode) document.body.classList.add("dark");

function salvar() {
  localStorage.setItem("servicos", JSON.stringify(dados));
}

function salvarDark() {
  localStorage.setItem("darkMode", darkMode);
}

function render() {
  const container = document.getElementById("grupos");
  container.innerHTML = "";

  dados.forEach((grupo, gIndex) => {
    const div = document.createElement("div");
    div.className = "grupo";

    div.innerHTML = `
      <h2>
        ${grupo.minimizado ? "▶️" : "▼"}
        ${grupo.nome}
      </h2>

      <button class="editar" onclick="editarGrupo(${gIndex})">Editar</button>
      <button class="remover" onclick="removerGrupo(${gIndex})">Excluir</button>
      <button class="toggle" onclick="toggleGrupo(${gIndex})">
        ${grupo.minimizado ? "Expandir" : "Minimizar"}
      </button>

      <div style="display:${grupo.minimizado ? "none" : "block"}">

        <input type="text" placeholder="Novo impeditivo" id="input-${gIndex}">
        <button onclick="adicionarItem(${gIndex})">Adicionar</button>

        <div id="lista-${gIndex}"></div>

        <button class="reset" onclick="resetGrupo(${gIndex})">
          Desmarcar tudo
        </button>

      </div>
    `;

    container.appendChild(div);

    if (!grupo.minimizado) {
      const lista = div.querySelector(`#lista-${gIndex}`);

      grupo.itens.forEach((item, iIndex) => {
        const itemDiv = document.createElement("div");
        itemDiv.className = "servico";

        itemDiv.innerHTML = `
          <input type="checkbox" ${item.checked ? "checked" : ""} 
            onchange="toggle(${gIndex}, ${iIndex})">

          <label class="${item.checked ? "concluido" : ""}">
            ${item.nome}
          </label>

          <button class="editar" onclick="editarItem(${gIndex}, ${iIndex})">
            Editar
          </button>

          <button class="remover" onclick="removerItem(${gIndex}, ${iIndex})">
            Remover
          </button>
        `;

        lista.appendChild(itemDiv);
      });
    }
  });
}

function criarGrupo() {
  const nome = document.getElementById("novoGrupo").value;
  if (!nome) return;

  dados.push({ nome, itens: [], minimizado: false });
  document.getElementById("novoGrupo").value = "";

  salvar();
  render();
}

function removerGrupo(gIndex) {
  if (!confirm("Excluir grupo?")) return;

  dados.splice(gIndex, 1);
  salvar();
  render();
}

function editarGrupo(gIndex) {
  const novo = prompt("Novo nome do grupo:", dados[gIndex].nome);
  if (!novo) return;

  dados[gIndex].nome = novo;
  salvar();
  render();
}

function toggleGrupo(gIndex) {
  dados[gIndex].minimizado = !dados[gIndex].minimizado;
  salvar();
  render();
}

function adicionarItem(gIndex) {
  const input = document.getElementById(`input-${gIndex}`);
  if (!input.value) return;

  dados[gIndex].itens.push({
    nome: input.value,
    checked: false
  });

  input.value = "";
  salvar();
  render();
}

function editarItem(gIndex, iIndex) {
  const novo = prompt("Editar impeditivo:", dados[gIndex].itens[iIndex].nome);
  if (!novo) return;

  dados[gIndex].itens[iIndex].nome = novo;
  salvar();
  render();
}

function toggle(gIndex, iIndex) {
  dados[gIndex].itens[iIndex].checked =
    !dados[gIndex].itens[iIndex].checked;

  salvar();
  render();
}

function removerItem(gIndex, iIndex) {
  dados[gIndex].itens.splice(iIndex, 1);
  salvar();
  render();
}

function resetGrupo(gIndex) {
  dados[gIndex].itens.forEach(item => item.checked = false);
  salvar();
  render();
}

function toggleDarkMode() {
  darkMode = !darkMode;
  document.body.classList.toggle("dark");
  salvarDark();
}

render();
</script>

</body>
</html>
