<html><head><title>Editor HTML</title>
<meta name="viewport" content="width=device-width, user-scalable=no">
<link href="https://cdn-icons-png.flaticon.com/512/4226/4226577.png" rel="icon">

</head>
<body>
<input type="file" onchange="readFile(this);" id="file"><a href="#" target="_blank" style="position: absolute; top: 0.5%; right: 20%; text-decoration: none; font-weight: bolder; font-size: 25px;" id="n">+</a>

<input type="button" value="Ex:" onclick="ex()" id="e">
 

<script>

document.onkeydown = function() {
if ((window.event.key === "Escape")) {c.click()}

if ((window.event.altKey && window.event.keyCode == 83)) {link.click()}

if ((window.event.altKey && window.event.keyCode == 82)) {pre.click()}

if ((window.event.altKey && window.event.keyCode == 79)) {file.click()}

if ((window.event.altKey && window.event.keyCode == 69)) {e.click()}

if ((window.event.altKey && window.event.keyCode == 78)) {n.click()}

if ((window.event.shiftKey && window.event.altKey)) {window.open(pre.href,'pre')};

if ((window.event.altKey && window.event.keyCode == 76)) {localStorage.clear()}

};

function readFile(input) {
  let file = input.files[0];

  let reader = new FileReader();

  reader.readAsText(file);

  reader.onload = function() {
    document.getElementById('text').value=reader.result;
    var blob = new Blob([document.getElementById('text').value], {type: document.getElementById('file').files[0].type}),
    url = window.URL.createObjectURL(blob);
document.getElementById('link').href=url;
document.getElementById('pre').href=url;
document.getElementById('text').focus();
  };

  reader.onerror = function() {
    alert(reader.error);
  };

}
function edit(){
var blob = new Blob([document.getElementById('text').value], {type: 'text/html'}), url = window.URL.createObjectURL(blob);
document.getElementById('link').href=url;
document.getElementById('pre').href=url;
}

function ex(){
var r=prompt('End-Point','')
r=r!=null ? r : 'https://api.binance.com/api/v3/ticker/24hr';
text.innerHTML=`<html>\n<head><title>Test</title>\n<meta name="viewport" content="width=device-width, user-scalable=no">\n<meta charset="UTF-8">\n</head>\n<script>\nfunction a(){\nfetch('${r}').then(function(r){r.json().then(function(r){\nb.innerHTML=JSON.stringify(r)\n})\n})\n}\n</scrip${'t'}>\n<body onload="a()">\n<center><form action="#" onsubmit="b.innerHTML='';a();return false" id="fo"><input id="depo" value="200" size="6"><input type="button" onclick="b.innerHTML='';a()" value="t"></form><br><div id="b"></div></center>\n</body>\n</html>`;
edit()
pre.click()
}

function storage(input) {
  let file = input.files[0];
  let reader = new FileReader();
  reader.readAsText(file);
  reader.onload = function() {
var l=prompt('Nome da Chave','')
    localStorage.setItem(l,reader.result)
  };
  reader.onerror = function() {
    alert(reader.error);
  };
}

function atualizarTitulo() {
  const arquivo = document.getElementById('file').files[0];
  const textarea = document.querySelector('#text');
  let novoTitulo = 'Documento em branco';

  if (arquivo) {
    // Caso tenha arquivo selecionado, usa o nome dele
    novoTitulo = arquivo.name;
  } else if (textarea && textarea.value) {
    // Procura um <title>...</title> dentro do texto
    const match = textarea.value.match(/<title>(.*?)<\/title>/i);
    if (match && match[1].trim()) {
      novoTitulo = match[1].trim();
    }
  }

  // Define o título da janela principal (window.top)
  window.top.document.title = novoTitulo;
}



</script>
<iframe style="position: absolute; top: 0px; left: 0px; background: white; z-index: 998; border: 0px; width: 100%; height: 100%; display: none" name="view"></iframe><button style="position: absolute; top: 0px; right: 0px; z-index: 999; color: red; border: red 3px solid; display: none" id="c" onclick="this.style.display='none';document.getElementsByName('view')[0].style.display='none';">X</button><input type="file" onchange="storage(this);atualizarTitulo();" style="display:none;" id="sto"><input type="button" value="??" onclick="sto.click()" style="margin-left: 7%;">
<br><textarea id="text" onkeyup="edit();atualizarTitulo();" style="width: 99%; height: 300px; background: #1c1b22; color: white;"></textarea><br><a id="link" style="margin-right: 10px;" download="test.htm" onclick="document.getElementById('file').value!='' ? this.download=prompt('Salvar Como...',document.getElementById('file').files[0].name) : this.download=prompt('Salvar Como...','.htm')" href="">download</a>
<a id="pre" target="view" onclick="document.getElementById('c').style.display='block';document.getElementsByName('view')[0].style.display='block';" href="">preview</a>&nbsp;<a href="#" onclick="this.href=pre.href" target="pre">+</a>&nbsp;&nbsp;<a href="./Beautifier%20Simplificado.htm" target="view" onclick="document.getElementById('c').style.display='block';document.getElementsByName('view')[0].style.display='block';">Beautifier Simplificado</a>
 </body></html>
